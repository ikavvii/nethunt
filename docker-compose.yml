# ==============================================================================
# LOGIN 2026 NETHUNT - DOCKER COMPOSE CONFIGURATION
# PSG College of Technology - MCA Alumni Cryptic Hunt Platform
# ==============================================================================

services:
  nethunt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: login2026_nethunt
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - ADMIN_KEY=login2026admin
      - JWT_SECRET=login2026_psg_tech_mca_alumni_nethunt_secret_key_prod
    volumes:
      # Mount host directory for persistent SQLite database and backup survival
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
